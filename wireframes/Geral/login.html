<!DOCTYPE html><html class="dark" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - FORJA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Montserrat:ital,wght@0,700;0,900;1,900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#ffcdc7",
                        "tertiary": "#ffb95f",
                        "surface-container-high": "#2a2a2a",
                        "surface-bright": "#3a3939",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#410004",
                        "on-surface": "#e5e2e1",
                        "secondary-fixed": "#ffdad7",
                        "primary-container": "#b91c1c",
                        "background": "#131313",
                        "secondary-container": "#a40217",
                        "outline": "#ab8985",
                        "error-container": "#93000a",
                        "surface-dim": "#131313",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-error": "#690005",
                        "tertiary-container": "#855300",
                        "primary": "#ffb4ab",
                        "on-background": "#e5e2e1",
                        "inverse-surface": "#e5e2e1",
                        "surface-tint": "#ffb4ab",
                        "tertiary-fixed": "#ffddb8",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#93000b",
                        "on-primary": "#690005",
                        "on-tertiary-fixed": "#2a1700",
                        "on-tertiary-container": "#ffd099",
                        "secondary-fixed-dim": "#ffb3ad",
                        "inverse-on-surface": "#313030",
                        "surface-container": "#201f1f",
                        "surface-variant": "#353534",
                        "surface": "#131313",
                        "inverse-primary": "#b91c1c",
                        "outline-variant": "#5b403d",
                        "on-primary-fixed": "#410002",
                        "on-secondary-fixed-variant": "#930013",
                        "primary-fixed": "#ffdad6",
                        "surface-container-highest": "#353534",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-secondary": "#68000a",
                        "secondary": "#ffb3ad",
                        "on-surface-variant": "#e4beb9",
                        "on-tertiary": "#472a00",
                        "primary-fixed-dim": "#ffb4ab",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary-container": "#ffaea8",
                        "surface-container-lowest": "#0e0e0e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max-width": "1280px",
                        "margin-desktop": "64px",
                        "unit": "4px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Montserrat"],
                        "label-bold": ["Inter"],
                        "headline-md": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900" }],
                        "label-bold": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #374151;
        }
        
        .input-glow:focus {
            box-shadow: inset 0 0 4px rgba(185, 28, 28, 0.5);
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 12px rgba(185, 28, 28, 0.6);
        }
        
        .bg-pattern {
            background-image: radial-gradient(circle at center, rgba(185, 28, 28, 0.05) 0%, transparent 70%);
            background-size: 100% 100%;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden bg-pattern">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute top-[80%] right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-panel rounded-xl p-8 md:p-10 shadow-2xl flex flex-col items-center">
<!-- Logo -->
<div class="mb-10 text-center">
<h1 class="font-display-lg text-display-lg tracking-tighter text-primary italic uppercase drop-shadow-md">FORJA</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">The heat, pressure, and precision.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="email">E-mail</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">mail</span>
</div>
<input class="w-full bg-[#0A0A0A] border border-[#374151] rounded-lg py-3 pl-10 pr-3 font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container input-glow transition-all outline-none placeholder-outline-variant" id="email" placeholder="seu@email.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
<input class="w-full bg-[#0A0A0A] border border-[#374151] rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container input-glow transition-all outline-none placeholder-outline-variant" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-4">
<label class="flex items-center cursor-pointer group">
<input class="form-checkbox bg-[#0A0A0A] border-[#374151] text-primary-container rounded focus:ring-primary-container focus:ring-offset-0 focus:ring-offset-transparent" type="checkbox">
<span class="ml-2 font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar de mim</span>
</label>
<a class="font-label-bold text-label-bold text-tertiary hover:text-tertiary-fixed transition-colors" href="#">Esqueceu a senha?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-4 rounded-lg mt-8 btn-glow transition-all active:scale-95 flex justify-center items-center gap-2" type="submit">
                    Entrar na Plataforma
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Register Link -->
<div class="mt-8 text-center w-full border-t border-outline-variant/30 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Novo aluno? 
                    <a class="font-label-bold text-label-bold text-primary hover:text-primary-fixed transition-colors ml-1" href="#">Crie sua conta</a>
</p>
</div>
</div>
</div>
</body></html>
