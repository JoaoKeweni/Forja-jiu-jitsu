<!DOCTYPE html><html class="dark" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FORJA - Cadastro Simplificado</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<style>
        .input-glow:focus {
            box-shadow: inset 0 0 0 1px #b91c1c;
            border-color: #b91c1c;
        }
        .btn-glow:hover {
            box-shadow: 0 0 12px 0px rgba(185, 28, 28, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation omitted intentionally due to linear/transactional flow rule -->
<main class="flex-1 flex flex-col w-full max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop justify-center items-center py-12">
<div class="w-full max-w-md bg-surface-container border border-surface-variant rounded-xl p-8 shadow-2xl relative overflow-hidden">
<!-- Subtle glassmorphism/gradient accent -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container rounded-full blur-[80px] opacity-20 pointer-events-none"></div>
<div class="text-center mb-8 relative z-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary italic uppercase tracking-tighter mb-2">FORJA</h1>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Cadastro do Aluno</h2>
<p class="text-on-surface-variant font-body-md text-body-md">Siga o caminho. Inicie sua jornada.</p>
</div>
<!-- Etapa 1 -->
<form class="space-y-6 relative z-10" id="signup-form">
<div class="space-y-4 transition-all duration-300" id="step-1">
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="name">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors placeholder-on-surface-variant/50" id="name" name="name" placeholder="Seu nome" type="text">
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="seu@email.com" type="email">
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="phone">Telefone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">phone</span>
<input class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors placeholder-on-surface-variant/50" id="phone" name="phone" placeholder="(00) 00000-0000" type="tel">
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<button class="w-full bg-primary-container text-white font-label-bold text-label-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-secondary-container transition-all btn-glow mt-6" onclick="nextStep()" type="button">
                        Continuar
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Etapa 2 -->
<div class="hidden space-y-5 transition-all duration-300 opacity-0 translate-x-4" id="step-2">
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-2">Foto de Perfil</label>
<div class="flex items-center gap-4">
<div class="w-20 h-20 rounded-full bg-surface-dim border-2 border-dashed border-outline-variant flex items-center justify-center text-outline overflow-hidden relative group cursor-pointer">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform">add_a_photo</span>
<!-- Hidden input for actual upload logic in production -->
<input class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file">
</div>
<div class="flex-1">
<p class="text-sm text-on-surface-variant">Faça upload de uma foto clara do seu rosto.</p>
<p class="text-xs text-outline mt-1">JPG ou PNG, máx. 5MB.</p>
</div>
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="academy">Selecione sua Academia</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">domain</span>
<select class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-10 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors appearance-none" id="academy" name="academy">
<option disabled="" selected="" value="">Escolha a academia</option>
<option value="1">Gracie Barra Matriz</option>
<option value="2">Alliance São Paulo</option>
<option value="3">Checkmat Sede</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1" for="team">Equipe / Horário</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<select class="w-full bg-surface-dim border border-surface-variant rounded-lg py-3 pl-10 pr-10 text-on-surface focus:outline-none focus:ring-0 input-glow transition-colors appearance-none" id="team" name="team">
<option disabled="" selected="" value="">Escolha o horário</option>
<option value="1">Iniciantes - Seg/Qua/Sex 19:00</option>
<option value="2">Avançado - Ter/Qui 20:00</option>
<option value="3">Competição - Sábado 10:00</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex gap-3 mt-8">
<button class="flex-none bg-transparent border-2 border-outline text-on-surface font-label-bold text-label-bold py-4 px-4 rounded-lg flex items-center justify-center hover:bg-surface-variant transition-colors" onclick="prevStep()" type="button">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<button class="flex-1 bg-primary-container text-white font-label-bold text-label-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-secondary-container transition-all btn-glow" type="submit">
                            Finalizar Cadastro
                            <span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Já possui uma conta? <a class="text-primary hover:text-tertiary transition-colors underline" href="#">Faça login</a></p>
</div>
</div>
</main>
<script>
        function nextStep() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step1.style.opacity = '0';
            step1.style.transform = 'translateX(-1rem)';
            
            setTimeout(() => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                
                // Trigger reflow
                void step2.offsetWidth;
                
                step2.style.opacity = '1';
                step2.style.transform = 'translateX(0)';
            }, 300);
        }

        function prevStep() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step2.style.opacity = '0';
            step2.style.transform = 'translateX(1rem)';
            
            setTimeout(() => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                
                // Trigger reflow
                void step1.offsetWidth;
                
                step1.style.opacity = '1';
                step1.style.transform = 'translateX(0)';
            }, 300);
        }

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Implement submission logic
            console.log('Form submitted');
        });
    </script>
</body></html>
