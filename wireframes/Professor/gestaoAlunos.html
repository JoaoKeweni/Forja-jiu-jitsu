    function filterStudents() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const cards = document.querySelectorAll('.student-card');

        cards.forEach(card => {
            const name = card.dataset.name.toLowerCase();
            const belt = card.dataset.belt;
            const status = card.dataset.status;

            const matchesQuery = name.includes(query);
            const matchesBelt = selectedBelt === 'all' || belt === selectedBelt;
            const matchesStatus = selectedStatus === 'all' || status === selectedStatus;

            if (matchesQuery && matchesBelt && matchesStatus) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function filterBelt(belt, btn) {
        selectedBelt = belt;
        document.querySelectorAll('.belt-btn').forEach(b => b.classList.add('opacity-60'));
        btn.classList.remove('opacity-60');
        filterStudents();
    }

    function filterStatus(status, btn) {
        selectedStatus = status;
        filterStudents();
    }
</script>
